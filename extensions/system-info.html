<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统信息 · SYSTEM-SZ</title>
  <link rel="stylesheet" href="../extension-theme.css">
  <style>
    body {
      margin: 0;
      padding: 24px;
      color: var(--text-color, #24364b);
      background: transparent;
      font-family: inherit;
    }

    .extension-content {
      display: grid;
      gap: 16px;
    }

    .info-card {
      padding: 20px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 18px;
      background: rgba(255,255,255,.32);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .18em;
      opacity: .55;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0;
      font-size: 28px;
      font-weight: 500;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 600;
    }

    p {
      margin: 0;
      font-size: 14px;
      line-height: 1.9;
      opacity: .78;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(100,130,160,.13);
      font-size: 13px;
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-value {
      opacity: .65;
      text-align: right;
    }

    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid rgba(70,110,160,.35);
    }

    a:hover {
      opacity: .65;
    }
  </style>
</head>

<body>
  <main class="extension-content">
    <section class="info-card">
      <div class="eyebrow">WELCOME TO MY SPACE</div>
      <h1>SYSTEM-SZ</h1>
      <p>
        这里是 SYSTEM-SZ 的个人空间。
        通过独立扩展模块组织站点内容，
        让每个功能都能独立维护与更新。
      </p>
    </section>

    <section class="info-card">
      <h2>站点信息</h2>

      <div class="info-row">
        <span>站点名称</span>
        <span class="info-value">SYSTEM-SZ</span>
      </div>

      <div class="info-row">
        <span>站点类型</span>
        <span class="info-value">Personal Website</span>
      </div>

      <div class="info-row">
        <span>页面架构</span>
        <span class="info-value">Static HTML</span>
      </div>

      <div class="info-row">
        <span>扩展机制</span>
        <span class="info-value">JSON Registry</span>
      </div>
    </section>

    <section class="info-card">
      <h2>公开链接</h2>
      <p>
        GitHub：
        <a href="https://github.com/SYSTEM-SZ" target="_blank" rel="noopener">
          SYSTEM-SZ
        </a>
      </p>
      <p style="margin-top:10px">
        Bilibili：
        <a href="https://space.bilibili.com/3546662595201297"
           target="_blank" rel="noopener">
          个人空间
        </a>
      </p>
    </section>
  </main>
</body>
</html>
