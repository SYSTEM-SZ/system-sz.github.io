<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#D6E6FF">
<meta name="description" content="SYSTEM-SZ Personal Website">
<title>SYSTEM-SZ</title>

<style>
:root {
  --blue: rgb(0,120,215);
  --ink: #0B2B45;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,body { height: 100%; }

body {
  font-family: "Helvetica Neue","PingFang SC","Hiragino Sans GB",
    "Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background: radial-gradient(circle at 100% 0%,#fff 0%,#fff 28%,#D6E6FF 62%,#91BAFF 100%);
  background-color: #91BAFF;
  color: var(--ink);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.bg-word {
  position: fixed;
  left: -.12em;
  bottom: -.18em;
  z-index: 0;
  font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size: min(32vw,40vh);
  font-weight: 900;
  line-height: .82;
  letter-spacing: .02em;
  color: rgba(255,255,255,.34);
  user-select: none;
  pointer-events: none;
  white-space: nowrap;
  animation: breathe 18s ease-in-out infinite;
}

@keyframes breathe {
  0%,100% { opacity: 1; }
  50% { opacity: .6; }
}

main {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.wordmark {
  position: relative;
  display: inline-block;
  font-size: max(56px,13.5vw);
  line-height: .95;
  letter-spacing: -.02em;
  white-space: nowrap;
  color: var(--blue);
}

.wordmark-button {
  position: relative;
  z-index: 1;
  display: block;
  border: 0;
  padding: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  line-height: inherit;
  letter-spacing: inherit;
  white-space: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.wordmark-button:focus-visible {
  outline: 2px solid rgba(0,120,215,.55);
  outline-offset: 10px;
  border-radius: 5px;
}

.wordmark .line {
  position: relative;
  display: block;
  color: var(--blue);
  --glare: radial-gradient(circle at 128% -110%,rgba(255,255,255,.98) 0%,rgba(255,255,255,.82) 30%,rgba(255,255,255,.44) 55%,rgba(255,255,255,.15) 78%,rgba(255,255,255,0) 100%);
  animation: wordmarkFloat 12s ease-in-out infinite;
}

@supports ((-webkit-background-clip:text) or (background-clip:text)) {
  .wordmark .line {
    background-image: var(--glare),linear-gradient(rgb(0,120,215),rgb(0,120,215));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
}

.press-overlay {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  white-space: nowrap;
  color: #fff;
  -webkit-text-fill-color: #fff;
  opacity: 0;
  pointer-events: none;
  text-shadow: 0 0 5px rgba(255,255,255,.42),0 0 12px rgba(255,255,255,.20);
  transition: opacity 220ms ease;
}

.wordmark.is-pressed .press-overlay { opacity: .38; }

.wordmark .reflection {
  position: absolute;
  left: 0;
  top: calc(100% - .08em);
  width: 100%;
  height: 100%;
  display: block;
  white-space: nowrap;
  pointer-events: none;
  user-select: none;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom,rgba(0,0,0,.34) 0%,rgba(0,0,0,.20) 28%,rgba(0,0,0,.07) 65%,transparent 100%);
  mask-image: linear-gradient(to bottom,rgba(0,0,0,.34) 0%,rgba(0,0,0,.20) 28%,rgba(0,0,0,.07) 65%,transparent 100%);
}

.wordmark .reflection-content {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  display: block;
  color: inherit;
  white-space: nowrap;
  transform: translateY(0) scaleY(-1);
  animation: reflectionFloat 12s ease-in-out infinite;
}

.light { font-weight: 300; }
.bold { font-weight: 800; }

@keyframes wordmarkFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}

@keyframes reflectionFloat {
  0%,100% { transform: translateY(0) scaleY(-1); }
  50% { transform: translateY(9px) scaleY(-1); }
}

.xor-lens {
  position: fixed;
  left: 0;
  top: 0;
  width: var(--lens-size,1em);
  height: var(--lens-size,1em);
  border-radius: 50%;
  background: #fff;
  mix-blend-mode: difference;
  pointer-events: none;
  z-index: 99999;
  opacity: 0;
  transform: translate(-50%,-50%) scale(.12);
  transition: opacity 220ms ease,transform 280ms cubic-bezier(.2,.8,.2,1);
  will-change: transform,opacity;
}

.xor-lens.is-visible {
  opacity: 1;
  transform: translate(-50%,-50%) scale(1);
}

.bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: clamp(24px,6vh,64px);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(14px,2.2vh,22px);
  text-align: center;
  pointer-events: none;
}

.tagline {
  font-size: clamp(13px,1.3vw,15px);
  letter-spacing: .18em;
  color: rgba(11,43,69,.55);
  font-style: italic;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
  pointer-events: auto;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 52px;
  height: 52px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid rgba(11,43,69,.16);
  background: rgba(255,255,255,.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--ink);
  text-decoration: none;
  pointer-events: auto;
  transition: color .25s ease,border-color .25s ease,background .25s ease,transform .25s ease,box-shadow .25s ease;
}

.btn svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
  display: block;
}

.btn:hover,.btn:focus-visible {
  color: var(--blue);
  border-color: rgba(0,120,215,.5);
  background: #fff;
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(0,120,215,.14);
  outline: none;
}

.btn:active { transform: translateY(0); }
.extension-trigger { cursor: pointer; font: inherit; }

/* 弹窗遮罩：只负责背景淡入淡出 */
.glass-modal[hidden] { display: none; }

/* 弹窗背景：背景模糊与淡入淡出 */
.glass-modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: block;
  padding: 12px;
  background: rgba(15,54,91,.10);
  -webkit-backdrop-filter: blur(0);
  backdrop-filter: blur(0);
  opacity: 0;
  pointer-events: none;
  transition:
    opacity .36s ease,
    backdrop-filter .45s ease,
    -webkit-backdrop-filter .45s ease;
}

.glass-modal.is-open {
  opacity: 1;
  pointer-events: auto;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}

/* 窗口主体：浮入、浮出 */
.glass-panel {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(620px,calc(100vw - 48px));
  height: min(720px,calc(100vh - 48px));
  min-width: 300px;
  min-height: 260px;
  max-width: calc(100vw - 24px);
  max-height: calc(100vh - 24px);
  overflow: auto;
  padding: 34px;

  border: 1px solid rgba(255,255,255,.68);
  border-radius: 26px;
  background: linear-gradient(
    145deg,
    rgba(255,255,255,.78),
    rgba(225,240,255,.64) 55%,
    rgba(195,222,255,.58)
  );
  box-shadow:
    0 24px 80px rgba(27,83,139,.15),
    inset 0 1px 0 rgba(255,255,255,.85);

  -webkit-backdrop-filter: blur(28px) saturate(135%);
  backdrop-filter: blur(28px) saturate(135%);

  opacity: 0;
  filter: blur(10px);
  transform: translate(-50%,-44%) scale(.94);

  /* 默认只负责浮入、浮出和最大化还原 */
  transition:
    opacity .38s ease,
    filter .42s ease,
    transform .48s cubic-bezier(.16,1,.3,1),
    left .32s cubic-bezier(.2,.75,.25,1),
    top .32s cubic-bezier(.2,.75,.25,1),
    width .32s cubic-bezier(.2,.75,.25,1),
    height .32s cubic-bezier(.2,.75,.25,1),
    border-radius .32s ease;
}

/* 打开：向上浮入 */
.glass-modal.is-open .glass-panel {
  opacity: 1;
  filter: blur(0);
  transform: translate(-50%,-50%) scale(1);
}

/* 最大化状态 */
.glass-panel.is-maximized {
  left: 12px !important;
  top: 12px !important;
  width: calc(100vw - 24px) !important;
  height: calc(100vh - 24px) !important;
  max-width: none;
  max-height: none;
  min-width: 0;
  min-height: 0;
  transform: none !important;
  border-radius: 19px;
}

/* 拖动和手动缩放期间：强制关闭所有补间动画 */
.glass-panel.is-manipulating {
  transition: none !important;
  filter: none !important;
}

/* 标题栏 */
.glass-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin: -12px -12px 24px;
  padding: 12px;
  min-height: 66px;
  user-select: none;
  cursor: grab;
  touch-action: none;
}

.glass-header:active { cursor: grabbing; }

.glass-eyebrow {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .22em;
  color: rgba(11,43,69,.45);
  margin-bottom: 10px;
}

.glass-title {
  font-size: 24px;
  font-weight: 650;
  letter-spacing: .01em;
  color: #0B2B45;
}

.glass-description {
  margin-top: 9px;
  font-size: 13px;
  line-height: 1.8;
  color: rgba(11,43,69,.55);
}

/* 窗口按钮：无背景，不旋转 */
.glass-window-actions {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.glass-window-control,
.glass-close {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent !important;
  color: rgba(11,43,69,.62);
  cursor: pointer;
  transition: color .2s ease,opacity .2s ease;
}

.glass-window-control:hover,
.glass-window-control:focus-visible,
.glass-close:hover,
.glass-close:focus-visible {
  background: transparent !important;
  color: var(--blue);
  outline: none;
}

.glass-close:hover { color: #D94B55; }

.glass-window-control svg,
.glass-close svg {
  width: 17px;
  height: 17px;
  display: block;
}

/* 内容区域 */
.glass-content {
  min-height: 220px;
  max-height: 52vh;
  display: block;
  overflow: auto;
  padding: 18px;
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 19px;
  background: rgba(255,255,255,.28);
  text-align: left;
}

.extension-list { display: grid; gap: 10px; }

.extension-item {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 15px 17px;
  border: 1px solid rgba(255,255,255,.58);
  border-radius: 15px;
  background: rgba(255,255,255,.42);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: background .2s ease,border-color .2s ease,transform .2s ease;
}

.extension-item:hover,.extension-item:focus-visible {
  background: rgba(255,255,255,.78);
  border-color: rgba(0,120,215,.3);
  transform: translateY(-1px);
  outline: none;
}

.extension-item-title { font-size: 14px; font-weight: 650; }

.extension-item-description {
  margin-top: 5px;
  font-size: 12px;
  line-height: 1.6;
  color: rgba(11,43,69,.55);
}

.extension-item-arrow {
  flex-shrink: 0;
  color: rgba(0,120,215,.65);
  font-size: 18px;
}

.extension-status {
  min-height: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  color: rgba(11,43,69,.65);
  font-size: 13px;
  line-height: 1.8;
}

.extension-status small {
  margin-top: 7px;
  color: rgba(11,43,69,.42);
  font-size: 11px;
}

.extension-view {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 220px;
}

.extension-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.extension-back {
  padding: 7px 13px;
  border: 1px solid rgba(11,43,69,.12);
  border-radius: 20px;
  background: rgba(255,255,255,.48);
  color: var(--ink);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: .2s ease;
}

.extension-back:hover,.extension-back:focus-visible {
  background: white;
  color: var(--blue);
  outline: none;
}

.extension-current-title {
  overflow: hidden;
  color: rgba(11,43,69,.55);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.extension-frame {
  display: block;
  width: 100%;
  min-height: 340px;
  height: 42vh;
  border: 0;
  border-radius: 13px;
  background: transparent;
}

.glass-footer {
  margin-top: 22px;
  text-align: center;
  font-size: 10px;
  letter-spacing: .14em;
  color: rgba(11,43,69,.35);
}

/* 移动端 */
@media (max-width:480px) {
  .btn { width: 48px; height: 48px; }
  .btn svg { width: 22px; height: 22px; }
  .wordmark { letter-spacing: -.03em; }

  .bg-word {
    font-size: min(30vw,36vh);
    left: -.14em;
    bottom: -.2em;
  }

  .glass-modal { padding: 8px; }

  .glass-panel {
    width: calc(100vw - 16px);
    height: min(82vh,calc(100vh - 16px));
    min-width: 0;
    padding: 22px;
    border-radius: 20px;
  }

  .glass-panel.is-maximized {
    left: 6px !important;
    top: 6px !important;
    width: calc(100vw - 12px) !important;
    height: calc(100vh - 12px) !important;
  }

  .glass-title { font-size: 21px; }
  .glass-content { padding: 12px; max-height: 56vh; }
  .extension-frame { height: 48vh; }
}

/* 减少动态效果 */
@media (prefers-reduced-motion:reduce) {
  .bg-word,.wordmark .line,.wordmark .reflection-content {
    animation: none !important;
  }

  .glass-modal,
  .glass-panel {
    transition-duration: .01ms !important;
  }

  *,*::before,*::after {
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<!-- 空间窗口 -->
<div class="glass-modal" id="extension-modal" aria-hidden="true" hidden>
  <section class="glass-panel" role="dialog" aria-modal="true"
    aria-labelledby="glass-title" aria-describedby="glass-description"
    tabindex="-1">

    <header class="glass-header">
      <div>
        <div class="glass-eyebrow">SYSTEM-SZ · SPACE</div>
        <h2 class="glass-title" id="glass-title">SYSTEM-SZ 的空间</h2>
        <p class="glass-description" id="glass-description">
          探索 SYSTEM-SZ 提供的内容与功能。
        </p>
      </div>

      <div class="glass-window-actions" aria-label="窗口控制">
        <button class="glass-window-control glass-window-toggle"
          type="button" aria-label="最大化窗口" title="最大化">
          <svg class="window-toggle-icon" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="5" width="14" height="14" rx="2"/>
          </svg>
        </button>

        <button class="glass-close" type="button"
          aria-label="关闭窗口" title="关闭">
          <svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="glass-content" id="extension-content" aria-live="polite">
      <div class="extension-status">
        正在读取内容
        <small>LOADING</small>
      </div>
    </div>

    <footer class="glass-footer">EXPLORE MORE FROM SYSTEM-SZ</footer>
  </section>
</div>

<script>
/* 动态光照 */
(function () {
  'use strict';

  var line = document.querySelector('.wordmark .line');
  if (!line) return;

  function updateGlare() {
    var rect = line.getBoundingClientRect();
    if (!rect.width || !rect.height) return;

  target.addEventListener('pointerleave',function (event) {

    document.fonts.ready.then(updateLensSize);

      var last = elements[elements.length - 1];

      if (event.shiftKey &&
          (document.activeElement === first ||
           document.activeElement === panel)) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey &&
                 document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }
  });
})();
</script>
</body>
</html>
