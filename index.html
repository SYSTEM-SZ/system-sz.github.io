<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SYSTEM-SZ</title>
<style>
  :root{
    --blue: rgb(0, 120, 215);
    --ink: #0B2B45;
  }

  *{ margin: 0; padding: 0; box-sizing: border-box; }

  html, body{ height: 100%; }

  body{
    font-family: "Helvetica Neue", "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 100% 0%, #FFFFFF 0%, #FFFFFF 28%, #D6E6FF 62%, #91BAFF 100%);
    background-color: #91BAFF;
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- 背景大字：欢迎 ---------- */
  .bg-word{
    position: fixed;
    left: -0.12em;
    bottom: -0.18em;
    z-index: 0;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: min(32vw, 40vh);
    font-weight: 900;
    line-height: 0.82;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.34);
    user-select: none;
    pointer-events: none;
    white-space: nowrap;
    animation: breathe 18s ease-in-out infinite;
  }

  @keyframes breathe{
    0%, 100%{ opacity: 1; }
    50%      { opacity: 0.6; }
  }

  /* ---------- 主体：整屏居中，只承载标题 ---------- */
  main{
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    text-align: center;
  }

  /* ---------- 标题 + 倒影 ---------- */
  .wordmark{
    position: relative;
    display: inline-block;
    font-size: max(56px, 13.5vw);
    line-height: 0.95;
    letter-spacing: -0.02em;
    white-space: nowrap;
    color: rgb(0, 120, 215);
    margin: 0;
  }

  .wordmark .line{
    display: block;
    color: var(--blue);
    --glare: radial-gradient(
      circle at 128% -110%,
      rgba(255, 255, 255, 0.98) 0%,
      rgba(255, 255, 255, 0.82) 30%,
      rgba(255, 255, 255, 0.44) 55%,
      rgba(255, 255, 255, 0.15) 78%,
      rgba(255, 255, 255, 0) 100%
    );
  }

  @supports ((-webkit-background-clip: text) or (background-clip: text)){
    .wordmark .line{
      background-image:
        var(--glare),
        linear-gradient(rgb(0, 120, 215), rgb(0, 120, 215));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
  }

  .wordmark .reflection{
    position: absolute;
    left: 0;
    top: calc(100% - 0.08em);
    width: 100%;
    display: block;
    color: inherit;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    transform: scaleY(-1);
    -webkit-mask-image: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0, 0, 0, 0.03) 30%,
      rgba(0, 0, 0, 0.35) 100%
    );
    mask-image: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0, 0, 0, 0.03) 30%,
      rgba(0, 0, 0, 0.35) 100%
    );
  }

  .light{ font-weight: 300; }
  .bold { font-weight: 800; }

  /* ---------- 底部信息区：撑满宽度 + flex 居中，避免 transform 半像素 ---------- */
  .bottom{
    position: fixed;
    left: 0;
    right: 0;
    bottom: clamp(24px, 6vh, 64px);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(14px, 2.2vh, 22px);
    text-align: center;
    pointer-events: none; /* 不挡底部点击，按钮单独恢复 */
  }

  .tagline{
    font-size: clamp(13px, 1.3vw, 15px);
    letter-spacing: 0.18em;
    color: rgba(11, 43, 69, 0.55);
    font-style: italic;
  }

  .actions{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    pointer-events: auto;
  }

  /* ---------- 圆形图标按钮 ---------- */
  .btn{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(11, 43, 69, 0.16);
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--ink);
    text-decoration: none;
    pointer-events: auto;
    transition: color .25s ease, border-color .25s ease, background .25s ease,
                transform .25s ease, box-shadow .25s ease;
  }

  .btn svg{
    width: 24px;
    height: 24px;
    fill: currentColor;
    display: block;
    /* 提升曲线精度，缩放时边缘更锐利 */
    shape-rendering: geometricPrecision;
  }

  .btn:hover, .btn:focus-visible{
    color: var(--blue);
    border-color: rgba(0, 120, 215, 0.5);
    background: #fff;
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0, 120, 215, 0.14);
    outline: none;
  }

  .btn:active{ transform: translateY(0); }

  @media (max-width: 480px){
    .btn{ width: 48px; height: 48px; }
    .btn svg{ width: 22px; height: 22px; }
    .wordmark{ letter-spacing: -0.03em; }
    .bg-word{ font-size: min(30vw, 36vh); left: -0.14em; bottom: -0.2em; }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-word{ animation: none; }
    *{ transition: none !important; }
  }
</style>
</head>
<body>

  <div class="bg-word" aria-hidden="true">欢迎</div>

  <main>
    <h1 class="wordmark">
      <span class="line">
        <span class="light">SYSTEM-</span><span class="bold">SZ</span>
      </span>
      <span class="reflection" aria-hidden="true">
        <span class="light">SYSTEM-</span><span class="bold">SZ</span>
      </span>
    </h1>
  </main>

  <div class="bottom">
    <p class="tagline">热爱 system 的 SYSTEM-SZ</p>

    <nav class="actions" aria-label="站点导航">

        </svg>

    </nav>
  </div>

  <script>
  (function () {
    var line = document.querySelector('.wordmark .line');
    if (!line) return;

    function lightX() { return window.innerWidth; }
    function lightY() { return 0; }

    function updateGlare() {
      var rect = line.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      var cx = lightX() - rect.left;
      var cy = lightY() - rect.top;

      var dx = cx - rect.width / 2;
      var dy = cy - rect.height / 2;
      var dist = Math.hypot(dx, dy) || 1;

      var radius = Math.max(dist * 1.35, rect.height * 1.75);

      line.style.setProperty(
        '--glare',
        'radial-gradient(circle ' + radius.toFixed(1) + 'px at ' +
        cx.toFixed(1) + 'px ' + cy.toFixed(1) + 'px,' +
        ' rgba(255, 255, 255, 0.98) 0%,' +
        ' rgba(255, 255, 255, 0.82) 30%,' +
        ' rgba(255, 255, 255, 0.44) 55%,' +
        ' rgba(255, 255, 255, 0.15) 78%,' +
        ' rgba(255, 255, 255, 0) 100%)'
      );
    }

    updateGlare();

    if ('ResizeObserver' in window) {
      var ro = new ResizeObserver(updateGlare);
      ro.observe(line);
      ro.observe(document.documentElement);
    }
    window.addEventListener('resize', updateGlare, { passive: true });
    window.addEventListener('scroll', updateGlare, { passive: true });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(updateGlare);
    }
  })();
  </script>
