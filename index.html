
<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#D6E6FF">
<meta name="description" content="SYSTEM-SZ Personal Website">
<title>SYSTEM-SZ</title>

<style>
:root {
  --blue: rgb(0, 120, 215);
  --ink: #0B2B45;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
}

body {
  font-family:
    "Helvetica Neue",
    "PingFang SC",
    "Hiragino Sans GB",
    "Microsoft YaHei",
    system-ui,
    -apple-system,
    sans-serif;

  background:
    radial-gradient(
      circle at 100% 0%,
      #FFFFFF 0%,
      #FFFFFF 28%,
      #D6E6FF 62%,
      #91BAFF 100%
    );

  background-color: #91BAFF;
  color: var(--ink);
  overflow: hidden;

  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* 背景大字 */

.bg-word {
  position: fixed;
  left: -0.12em;
  bottom: -0.18em;
  z-index: 0;

  font-family:
    "PingFang SC",
    "Hiragino Sans GB",
    "Microsoft YaHei",
    sans-serif;

  font-size: min(32vw, 40vh);
  font-weight: 900;
  line-height: 0.82;
  letter-spacing: 0.02em;

  color: rgba(255,255,255,0.34);

  user-select: none;
  pointer-events: none;
  white-space: nowrap;

  animation: breathe 18s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* 页面主体 */

main {
  position: relative;
  z-index: 1;

  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;
  text-align: center;
}

/* SYSTEM-SZ WORDMARK */

.wordmark {
  position: relative;
  display: inline-block;

  font-size: max(56px, 13.5vw);
  line-height: 0.95;
  letter-spacing: -0.02em;
  white-space: nowrap;

  color: var(--blue);
  margin: 0;
}

/* 标题按钮 */

.wordmark-button {
  position: relative;
  z-index: 1;

  display: block;

  border: 0;
  padding: 0;
  margin: 0;

  background: transparent;
  color: inherit;

  font: inherit;
  line-height: inherit;
  letter-spacing: inherit;

  white-space: inherit;
  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.wordmark-button:focus-visible {
  outline: 2px solid rgba(0,120,215,0.55);
  outline-offset: 10px;
  border-radius: 5px;
}

/* 主标题 */

.wordmark .line {
  position: relative;
  display: block;

  color: var(--blue);

  --glare: radial-gradient(
    circle at 128% -110%,
    rgba(255,255,255,0.98) 0%,
    rgba(255,255,255,0.82) 30%,
    rgba(255,255,255,0.44) 55%,
    rgba(255,255,255,0.15) 78%,
    rgba(255,255,255,0) 100%
  );

  animation: wordmarkFloat 12s ease-in-out infinite;
}

@supports (
  (-webkit-background-clip: text) or
  (background-clip: text)
) {
  .wordmark .line {
    background-image:
      var(--glare),
      linear-gradient(
        rgb(0,120,215),
        rgb(0,120,215)
      );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;
    color: transparent;
  }
}

/* 白色按压覆盖层 */

.press-overlay {
  position: absolute;
  inset: 0;

  display: block;
  width: 100%;

  white-space: nowrap;

  color: #fff;
  -webkit-text-fill-color: #fff;

  opacity: 0;
  pointer-events: none;

  text-shadow:
    0 0 5px rgba(255,255,255,0.42),
    0 0 12px rgba(255,255,255,0.20);

  transition: opacity 220ms ease;
}

.wordmark.is-pressed .press-overlay {
  opacity: 0.38;
}

/* 倒影 */

.wordmark .reflection {
  position: absolute;

  left: 0;
  top: calc(100% - 0.08em);

  width: 100%;
  height: 100%;

  display: block;
  white-space: nowrap;

  pointer-events: none;
  user-select: none;

  overflow: hidden;

  -webkit-mask-image: linear-gradient(
    to bottom,
    rgba(0,0,0,0.34) 0%,
    rgba(0,0,0,0.20) 28%,
    rgba(0,0,0,0.07) 65%,
    transparent 100%
  );

  mask-image: linear-gradient(
    to bottom,
    rgba(0,0,0,0.34) 0%,
    rgba(0,0,0,0.20) 28%,
    rgba(0,0,0,0.07) 65%,
    transparent 100%
  );
}

.wordmark .reflection-content {
  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  display: block;

  color: inherit;
  white-space: nowrap;

  transform: translateY(0) scaleY(-1);

  animation: reflectionFloat 12s ease-in-out infinite;
}

.light {
  font-weight: 300;
}

.bold {
  font-weight: 800;
}

@keyframes wordmarkFloat {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-9px);
  }
}

@keyframes reflectionFloat {
  0%, 100% {
    transform: translateY(0) scaleY(-1);
  }

  50% {
    transform: translateY(9px) scaleY(-1);
  }
}

/* XOR 鼠标透镜 */

.xor-lens {
  position: fixed;

  left: 0;
  top: 0;

  width: var(--lens-size, 1em);
  height: var(--lens-size, 1em);

  border-radius: 50%;
  background: #fff;

  mix-blend-mode: difference;

  pointer-events: none;
  z-index: 99999;

  opacity: 0;

  transform:
    translate(-50%, -50%)
    scale(0.12);

  transition:
    opacity 220ms ease,
    transform 280ms cubic-bezier(.2,.8,.2,1);

  will-change: transform, opacity;
}

.xor-lens.is-visible {
  opacity: 1;

  transform:
    translate(-50%, -50%)
    scale(1);
}

/* 底部信息 */

.bottom {
  position: fixed;

  left: 0;
  right: 0;

  bottom: clamp(24px, 6vh, 64px);

  z-index: 2;

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: clamp(14px, 2.2vh, 22px);

  text-align: center;
  pointer-events: none;
}

.tagline {
  font-size: clamp(13px, 1.3vw, 15px);
  letter-spacing: 0.18em;

  color: rgba(11,43,69,0.55);
  font-style: italic;
}

/* 按钮组 */

.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;

  gap: 14px;
  pointer-events: auto;
}

/* 圆形图标按钮 */

.btn {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  width: 52px;
  height: 52px;

  padding: 0;
  border-radius: 50%;

  border: 1px solid rgba(11,43,69,0.16);

  background: rgba(255,255,255,0.55);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  color: var(--ink);
  text-decoration: none;

  pointer-events: auto;

  transition:
    color .25s ease,
    border-color .25s ease,
    background .25s ease,
    transform .25s ease,
    box-shadow .25s ease;
}

.btn svg {
  width: 24px;
  height: 24px;

  fill: currentColor;
  display: block;

  shape-rendering: geometricPrecision;
}

.btn:hover,
.btn:focus-visible {
  color: var(--blue);

  border-color: rgba(0,120,215,0.5);
  background: #fff;

  transform: translateY(-2px);

  box-shadow:
    0 10px 24px rgba(0,120,215,0.14);

  outline: none;
}

.btn:active {
  transform: translateY(0);
}

.extension-trigger {
  cursor: pointer;
  font: inherit;
}

/* 扩展玻璃弹窗 */

.glass-modal[hidden] {
  display: none;
}

.glass-modal {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: grid;
  place-items: center;

  padding: 24px;

  background: rgba(15,54,91,0.10);

  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);

  opacity: 0;
  pointer-events: none;

  transition: opacity .32s ease;
}

.glass-modal.is-open {
  opacity: 1;
  pointer-events: auto;
}

.glass-panel {
  position: relative;

  width: min(620px, 100%);
  max-height: 82vh;

  overflow-y: auto;

  padding: 34px;

  border: 1px solid rgba(255,255,255,.68);
  border-radius: 26px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.78),
      rgba(225,240,255,.64) 55%,
      rgba(195,222,255,.58)
    );

  box-shadow:
    0 24px 80px rgba(27,83,139,.15),
    inset 0 1px 0 rgba(255,255,255,.85);

  -webkit-backdrop-filter: blur(28px) saturate(135%);
  backdrop-filter: blur(28px) saturate(135%);

  opacity: 0;

  transform:
    translateY(12px)
    scale(.985);

  transition:
    opacity .32s ease,
    transform .32s cubic-bezier(.2,.75,.25,1);
}

.glass-modal.is-open .glass-panel {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* 弹窗头部 */

.glass-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  gap: 20px;
  margin-bottom: 24px;
}

.glass-eyebrow {
  font-size: 10px;
  font-weight: 700;

  letter-spacing: .22em;

  color: rgba(11,43,69,.45);
  margin-bottom: 10px;
}

.glass-title {
  font-size: 24px;
  font-weight: 650;

  letter-spacing: .01em;
  color: #0B2B45;
}

.glass-description {
  margin-top: 9px;

  font-size: 13px;
  line-height: 1.8;

  color: rgba(11,43,69,.55);
}

/* 关闭按钮 */

.glass-close {
  width: 36px;
  height: 36px;

  flex-shrink: 0;

  display: grid;
  place-items: center;

  border: 1px solid rgba(11,43,69,.10);
  border-radius: 50%;

  background: rgba(255,255,255,.5);
  color: #0B2B45;

  cursor: pointer;

  transition: .2s ease;
}

.glass-close:hover,
.glass-close:focus-visible {
  background: white;
  color: var(--blue);

  transform: rotate(90deg);
  outline: none;
}

/* 扩展列表 */

.glass-content {
  min-height: 220px;
  max-height: 52vh;

  display: block;
  overflow: auto;

  padding: 18px;

  border: 1px solid rgba(255,255,255,.55);
  border-radius: 19px;

  background: rgba(255,255,255,.28);

  text-align: left;
}

.extension-list {
  display: grid;
  gap: 10px;
}

.extension-item {
  width: 100%;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 16px;
  padding: 15px 17px;

  border: 1px solid rgba(255,255,255,.58);
  border-radius: 15px;

  background: rgba(255,255,255,.42);
  color: var(--ink);

  text-align: left;
  cursor: pointer;

  transition:
    background .2s ease,
    border-color .2s ease,
    transform .2s ease;
}

.extension-item:hover,
.extension-item:focus-visible {
  background: rgba(255,255,255,.78);
  border-color: rgba(0,120,215,.3);
  transform: translateY(-1px);
  outline: none;
}

.extension-item-title {
  font-size: 14px;
  font-weight: 650;
}

.extension-item-description {
  margin-top: 5px;

  font-size: 12px;
  line-height: 1.6;

  color: rgba(11,43,69,.55);
}

.extension-item-arrow {
  flex-shrink: 0;
  color: rgba(0,120,215,.65);
  font-size: 18px;
}

/* 加载状态 */

.extension-status {
  min-height: 180px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 24px;

  text-align: center;

  color: rgba(11,43,69,.65);
  font-size: 13px;
  line-height: 1.8;
}

.extension-status small {
  margin-top: 7px;
  color: rgba(11,43,69,.42);
  font-size: 11px;
}

/* 外部 HTML 视图 */

.extension-view {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 220px;
}

.extension-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.extension-back {
  padding: 7px 13px;

  border: 1px solid rgba(11,43,69,.12);
  border-radius: 20px;

  background: rgba(255,255,255,.48);
  color: var(--ink);

  font: inherit;
  font-size: 12px;
  cursor: pointer;

  transition: .2s ease;
}

.extension-back:hover,
.extension-back:focus-visible {
  background: white;
  color: var(--blue);
  outline: none;
}

.extension-current-title {
  overflow: hidden;

  color: rgba(11,43,69,.55);
  font-size: 12px;

  text-overflow: ellipsis;
  white-space: nowrap;
}

.extension-frame {
  display: block;

  width: 100%;
  min-height: 340px;
  height: 42vh;

  border: 0;
  border-radius: 13px;

  background: transparent;
}

/* 底部 */

.glass-footer {
  margin-top: 22px;

  text-align: center;

  font-size: 10px;
  letter-spacing: .14em;

  color: rgba(11,43,69,.35);
}

/* MOBILE */

@media (max-width: 480px) {
  .btn {
    width: 48px;
    height: 48px;
  }

  .btn svg {
    width: 22px;
    height: 22px;
  }

  .wordmark {
    letter-spacing: -0.03em;
  }

  .bg-word {
    font-size: min(30vw, 36vh);
    left: -0.14em;
    bottom: -0.2em;
  }

  .glass-modal {
    padding: 18px;
  }

  .glass-panel {
    padding: 25px;
    border-radius: 23px;
  }

  .glass-title {
    font-size: 21px;
  }

  .glass-content {
    padding: 12px;
    max-height: 56vh;
  }

  .extension-frame {
    height: 48vh;
  }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
  .bg-word,
  .wordmark .line,
  .wordmark .reflection-content {
    animation: none !important;
  }

  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
  }

  .glass-modal,
  .glass-panel {
    animation: none;
  }
}
</style>
</head>

<div
  class="glass-modal"
  id="extension-modal"
  aria-hidden="true"
  hidden
>

    class="glass-panel"
    role="dialog"

  >

            stroke-linecap="round"
          />

      class="glass-content"
      id="extension-content"
      aria-live="polite"

<script>
/* 动态光照 */

(function () {
  'use strict';

  var line = document.querySelector('.wordmark .line');
  if (!line) return;

  function updateGlare() {
    var rect = line.getBoundingClientRect();
    if (!rect.width || !rect.height) return;

    var cx = window.innerWidth - rect.left;
    var cy = -rect.top;

    var dx = cx - rect.width / 2;
    var dy = cy - rect.height / 2;

    var dist = Math.hypot(dx, dy) || 1;

    var radius = Math.max(
      dist * 1.35,
      rect.height * 1.75
    );

    line.style.setProperty(
      '--glare',
      'radial-gradient(circle ' +
      radius.toFixed(1) +
      'px at ' +
      cx.toFixed(1) +
      'px ' +
      cy.toFixed(1) +
      'px,' +
      ' rgba(255,255,255,.98) 0%,' +
      ' rgba(255,255,255,.82) 30%,' +
      ' rgba(255,255,255,.44) 55%,' +
      ' rgba(255,255,255,.15) 78%,' +
      ' rgba(255,255,255,0) 100%)'
    );
  }

  updateGlare();

  if ('ResizeObserver' in window) {
    var observer = new ResizeObserver(updateGlare);
    observer.observe(line);
    observer.observe(document.documentElement);
  }

  window.addEventListener('resize', updateGlare, { passive: true });
  window.addEventListener('scroll', updateGlare, { passive: true });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(updateGlare);
  }
})();
</script>

<script>
/* 按压覆盖层 */

(function () {
  'use strict';

  var wordmark = document.getElementById('wordmark');
  var target = document.getElementById('wordmark-button');

  if (!wordmark || !target) return;

  function press() {
    wordmark.classList.add('is-pressed');
  }

  function release() {
    wordmark.classList.remove('is-pressed');
  }

  target.addEventListener('pointerdown', press);

  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  target.addEventListener('lostpointercapture', release);
  target.addEventListener('blur', release);

  target.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === ' ') press();
  });

  target.addEventListener('keyup', function (event) {
    if (event.key === 'Enter' || event.key === ' ') release();
  });

  window.addEventListener('blur', release);
})();
</script>

<script>
/* XOR 鼠标透镜 */

(function () {
  'use strict';

  var target = document.getElementById('wordmark-button');

  if (
    !target ||
    !window.matchMedia('(hover:hover) and (pointer:fine)').matches
  ) return;

  var lens = document.createElement('div');

  lens.className = 'xor-lens';
  lens.setAttribute('aria-hidden', 'true');

  document.body.appendChild(lens);

  var active = false;

  function updateLensSize() {
    var style = window.getComputedStyle(target);

    var canvas = document.createElement('canvas');
    var context = canvas.getContext('2d');

    if (!context) return;

    context.font = [
      style.fontStyle,
      style.fontVariant,
      style.fontWeight,
      style.fontSize,
      style.fontFamily
    ].join(' ');

    var width = context.measureText('全').width;

    lens.style.setProperty(
      '--lens-size',
      Math.max(width, 1) + 'px'
    );
  }

  function moveLens(event) {
    lens.style.left = event.clientX + 'px';
    lens.style.top = event.clientY + 'px';
  }

  function enterLens(event) {
    updateLensSize();
    moveLens(event);

    active = true;

    requestAnimationFrame(function () {
      if (active) lens.classList.add('is-visible');
    });
  }

  function leaveLens() {
    active = false;
    lens.classList.remove('is-visible');
  }

  target.addEventListener('pointerenter', function (event) {
    if (event.pointerType === 'mouse') enterLens(event);
  });

  target.addEventListener('pointermove', function (event) {
    if (event.pointerType === 'mouse') moveLens(event);
  });

  target.addEventListener('pointerleave', function (event) {
    if (event.pointerType === 'mouse') leaveLens();
  });

  if ('ResizeObserver' in window) {
    new ResizeObserver(updateLensSize).observe(target);
  }

  window.addEventListener('resize', updateLensSize, { passive: true });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(updateLensSize);
  }

  updateLensSize();
})();
</script>

<script>
/* 静态扩展加载器 */

(function () {
  'use strict';

  var modal = document.getElementById('extension-modal');
  var wordmarkTrigger = document.getElementById('wordmark-button');
  var extensionTrigger = document.querySelector('.extension-trigger');

  if (!modal || !wordmarkTrigger || !extensionTrigger) return;

  var panel = modal.querySelector('.glass-panel');
  var closeButton = modal.querySelector('.glass-close');
  var content = document.getElementById('extension-content');

  var previousFocus = null;
  var previousOverflow = '';
  var closeTimer = null;

  var extensions = [];

  // 注册表缓存
  var registryLoaded = false;
  var registryPromise = null;

  // 页面内容缓存
  var extensionCache = new Map();

  // 主题 CSS 缓存
  var themeCSSPromise = null;

  var fadeDuration = window.matchMedia(
    '(prefers-reduced-motion:reduce)'
  ).matches ? 0 : 340;

  var focusableSelector = [
    'a[href]',
    'button:not([disabled])',
    'input:not([disabled])',
    'select:not([disabled])',
    'textarea:not([disabled])',
    '[tabindex]:not([tabindex="-1"])'
  ].join(',');

  var registryURL = new URL('./extensions.json', document.baseURI);
  var themeURL = new URL('./extension-theme.css', document.baseURI);

  var requestNumber = 0;

  function showStatus(title, detail) {
    content.replaceChildren();

    var box = document.createElement('div');
    box.className = 'extension-status';
    box.appendChild(document.createTextNode(title));

    if (detail) {
      var small = document.createElement('small');
      small.textContent = detail;
      box.appendChild(small);
    }

    content.appendChild(box);
  }

  /* 读取注册表 */

async function loadRegistry() {
  // 已成功读取过，不再请求
  if (registryLoaded) return;

  // 正在读取时，复用同一个请求
  if (registryPromise) return registryPromise;

  registryPromise = (async function () {
    showStatus('正在整理可用内容', 'PLEASE WAIT');

    try {
      var response = await fetch(registryURL.href);

      if (!response.ok) {
        throw new Error('内容读取失败：HTTP ' + response.status);
      }

      var data = await response.json();

      if (!Array.isArray(data)) {
        throw new Error('内容列表格式不正确');
      }

      var seen = new Set();

      extensions = data.filter(function (item) {
        if (
          !item ||
          typeof item.id !== 'string' ||
          typeof item.title !== 'string' ||
          typeof item.url !== 'string'
        ) return false;

        if (seen.has(item.id)) return false;

        seen.add(item.id);
        return true;
      });

      registryLoaded = true;
      renderExtensionList();

    } catch (error) {
      console.error('[SYSTEM-SZ]', error);

      showStatus(
        '暂时无法显示内容',
        '请稍后重试，或联系站点维护者。'
      );

      // 失败时允许下次重新请求
      registryPromise = null;
    }
  })();

  return registryPromise;
}

  /* 渲染扩展列表 */

  function renderExtensionList() {
    content.replaceChildren();

    if (!extensions.length) {
      showStatus(
        '暂时没有可展示的内容',
        '新的内容与功能将在这里呈现，欢迎稍后再来看看。'  
      );
      return;
    }

    var list = document.createElement('div');
    list.className = 'extension-list';

    extensions.forEach(function (item) {
      var button = document.createElement('button');

      button.type = 'button';
      button.className = 'extension-item';

      var textBox = document.createElement('div');

      var title = document.createElement('div');
      title.className = 'extension-item-title';
      title.textContent = item.title;

      var description = document.createElement('div');
      description.className = 'extension-item-description';
      description.textContent = item.description || '';

      textBox.append(title, description);

      var arrow = document.createElement('span');
      arrow.className = 'extension-item-arrow';
      arrow.setAttribute('aria-hidden', 'true');
      arrow.textContent = '›';

      button.append(textBox, arrow);

      button.addEventListener('click', function () {
        openExtension(item);
      });

      list.appendChild(button);
    });

    content.appendChild(list);
  }

  /* 为外部 HTML 注入统一主题 */

  async function prepareHTML(html, extensionURL) {
    if (!themeCSSPromise) {
      themeCSSPromise = fetch(themeURL.href)
        .then(function (response) {
          if (!response.ok) {
            throw new Error('统一主题 CSS 加载失败');
          }

          return response.text();
        })
        .catch(function (error) {
          themeCSSPromise = null;
          throw error;
        });
    }

    var themeCSS = await themeCSSPromise;

    var parser = new DOMParser();
    var doc = parser.parseFromString(html, 'text/html');

    var base = doc.createElement('base');
    base.href = new URL('.', extensionURL).href;

    doc.head.prepend(base);

    var style = doc.createElement('style');
    style.setAttribute('data-system-sz-theme', '');
    style.textContent = themeCSS;

    doc.head.appendChild(style);

    if (!doc.querySelector('meta[name="viewport"]')) {
      var viewport = doc.createElement('meta');
      viewport.name = 'viewport';
      viewport.content = 'width=device-width, initial-scale=1';

      doc.head.appendChild(viewport);
    }

    return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
  }

  /* 加载外部 HTML */

  async function openExtension(item) {
    var currentRequest = ++requestNumber;

    content.replaceChildren();

    var view = document.createElement('div');
    view.className = 'extension-view';

    var toolbar = document.createElement('div');
    toolbar.className = 'extension-toolbar';

    var back = document.createElement('button');
    back.type = 'button';
    back.className = 'extension-back';
    back.textContent = '← 返回内容列表';

    back.addEventListener('click', function () {
      requestNumber++;
      renderExtensionList();
    });

    var title = document.createElement('div');
    title.className = 'extension-current-title';
    title.textContent = item.title;

    toolbar.append(back, title);
    view.appendChild(toolbar);

    content.appendChild(view);

    var loading = document.createElement('div');
    loading.className = 'extension-status';
    loading.textContent = '正在加载扩展';

    view.appendChild(loading);

    try {
      var extensionURL = new URL(item.url, document.baseURI);

      if (!['http:', 'https:'].includes(extensionURL.protocol)) {
        throw new Error('扩展地址只允许 HTTP 或 HTTPS');
      }

      // 优先使用已经处理过的页面
      var srcdoc = extensionCache.get(item.id);

      if (!srcdoc) {
        var response = await fetch(extensionURL.href);

        if (!response.ok) {
          throw new Error('页面读取失败：HTTP ' + response.status);
        }

        var html = await response.text();

        srcdoc = await prepareHTML(html, extensionURL.href);

        // 保存处理后的页面
        extensionCache.set(item.id, srcdoc);
      }

      if (
        currentRequest !== requestNumber ||
        !content.contains(view)
      ) return;

      var frame = document.createElement('iframe');

      frame.className = 'extension-frame';
      frame.title = item.title;

      frame.setAttribute(
        'sandbox',
        'allow-scripts allow-forms allow-downloads'
      );

      frame.setAttribute('loading', 'eager');
      frame.srcdoc = srcdoc;

      loading.remove();
      view.appendChild(frame);

    } catch (error) {
      console.error('[SYSTEM-SZ Extension]', error);

      if (
        currentRequest !== requestNumber ||
        !content.contains(view)
      ) return;

      loading.textContent = '扩展加载失败';

      var detail = document.createElement('small');
      detail.textContent = error.message || '请检查扩展文件。';

      loading.appendChild(detail);
    }
  }

  /* 打开弹窗 */

  function openModal() {
    if (!modal.hidden) return;

    if (closeTimer) {
      clearTimeout(closeTimer);
      closeTimer = null;
    }

    previousFocus = document.activeElement;
    previousOverflow = document.body.style.overflow;

    modal.hidden = false;
    modal.inert = false;

    modal.setAttribute('aria-hidden', 'false');

    document.body.style.overflow = 'hidden';

    modal.classList.remove('is-open');

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        modal.classList.add('is-open');
      });
    });

    closeButton.focus();

    if (!registryLoaded) {
      loadRegistry();
    }
  }

  /* 关闭弹窗 */

  function closeModal() {
    if (modal.hidden || closeTimer) return;



    modal.classList.remove('is-open');

    modal.inert = true;
    modal.setAttribute('aria-hidden', 'true');

    document.body.style.overflow = previousOverflow;

    closeTimer = window.setTimeout(function () {
      modal.hidden = true;
      modal.inert = false;

      closeTimer = null;

      if (
        previousFocus &&
        typeof previousFocus.focus === 'function' &&
        document.contains(previousFocus)
      ) {
        previousFocus.focus();
      } else {
        extensionTrigger.focus();
      }
    }, fadeDuration);
  }

  wordmarkTrigger.addEventListener('click', openModal);
  extensionTrigger.addEventListener('click', openModal);

  closeButton.addEventListener('click', closeModal);

  modal.addEventListener('click', function (event) {
    if (event.target === modal) {
      closeModal();
    }
  });

  /* ESC 与 Tab 焦点管理 */

  document.addEventListener('keydown', function (event) {
    if (modal.hidden || modal.inert) return;

    if (event.key === 'Escape') {
      event.preventDefault();
      closeModal();
      return;
    }

    if (event.key === 'Tab') {
      var elements = Array.from(
        panel.querySelectorAll(focusableSelector)
      ).filter(function (element) {
        return element.getClientRects().length > 0;
      });

      if (!elements.length) {
        event.preventDefault();
        panel.focus();
        return;
      }

      var first = elements[0];
      var last = elements[elements.length - 1];

      if (
        event.shiftKey &&
        (
          document.activeElement === first ||
          document.activeElement === panel
        )
      ) {
        event.preventDefault();
        last.focus();

      } else if (
        !event.shiftKey &&
        document.activeElement === last
      ) {
        event.preventDefault();
        first.focus();
      }
    }
  });
})();
</script>
